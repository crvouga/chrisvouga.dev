# Semantic LLM combo templates for local 9Router.
# Sync resolves tiers → concrete models from connected providers' registries.
# No hardcoded model ids — only roles / provider ids + pick counts.
# Cursor model picker ids use the 9router- prefix.
version: 2
defaults:
  strategy: fallback # fallback | round-robin | fusion
  kind: llm
  pick_per_provider: 2

roles:
  # Provider ids only (never model ids). Keep these tight — registry
  # free/oauth categories include aggregators that break coding combos.
  cheap: [glm, minimax]
  free: [kiro]
  subscription: [claude, codex, cursor, github]

combos:
  - name: 9router-free
    description: Zero-cost agentic coding via free-tier providers
    tiers:
      - role: free
        pick: 4

  - name: 9router-free-fast
    description: Fast free loops (fewer free-tier models)
    tiers:
      - role: free
        pick: 3

  - name: 9router-budget
    description: Cheap paid primary, free last
    tiers:
      - role: cheap
        pick: 2
      - role: free
        pick: 2

  - name: 9router-max-sub-claude
    description: Maximize Claude Code subscription, then cheap, then free
    tiers:
      - providers: [claude]
        pick: 2
      - role: cheap
        pick: 1
      - role: free
        pick: 1

  - name: 9router-max-sub-codex
    description: Maximize OpenAI Codex subscription, then cheap, then free
    tiers:
      - providers: [codex]
        pick: 2
      - role: cheap
        pick: 1
      - role: free
        pick: 1

  - name: 9router-max-sub-cursor
    description: Maximize Cursor subscription, then cheap, then free
    tiers:
      - providers: [cursor]
        pick: 3
      - role: cheap
        pick: 1
      - role: free
        pick: 1

  - name: 9router-max-sub-copilot
    description: Maximize GitHub Copilot subscription, then cheap, then free
    tiers:
      - providers: [github]
        pick: 3
      - role: cheap
        pick: 1
      - role: free
        pick: 1

  - name: 9router-always-on
    description: Multi-subscription then cheap then free (zero downtime)
    tiers:
      - role: subscription
        pick: 2
      - role: cheap
        pick: 2
      - role: free
        pick: 1

  - name: 9router-agent-default
    description: Daily driver — Claude when available, then cheap, then free
    tiers:
      - providers: [claude]
        pick: 1
      - role: cheap
        pick: 2
      - role: free
        pick: 1
